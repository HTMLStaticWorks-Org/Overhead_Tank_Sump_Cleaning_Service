<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" fill="none">
  <defs>
    <linearGradient id="bgHero2" x1="0" y1="0" x2="920" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081C36"/>
      <stop offset="55%" stop-color="#0F2D56"/>
      <stop offset="100%" stop-color="#133B6E"/>
    </linearGradient>
    <linearGradient id="sumpInterior" x1="460" y1="210" x2="460" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="65%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <rect width="920" height="640" rx="24" fill="url(#bgHero2)"/>

  <!-- Ground Level Driveway / Building Apron Cutaway Line -->
  <rect x="40" y="165" width="840" height="24" rx="6" fill="#475569"/>
  <line x1="40" y1="165" x2="880" y2="165" stroke="#00A8E8" stroke-width="3"/>

  <!-- Underground Concrete Sump Cross-Section Chamber -->
  <rect x="95" y="189" width="730" height="370" rx="12" fill="#334155" stroke="#64748B" stroke-width="4"/>
  <rect x="125" y="215" width="670" height="315" rx="8" fill="url(#sumpInterior)"/>

  <!-- Sump Manhole Access Opening at Ground Level -->
  <rect x="380" y="155" width="160" height="62" fill="#0F172A" stroke="#00A8E8" stroke-width="3"/>

  <!-- Left Half of Sump: Active Sludge Vacuum & Dewatering Extraction -->
  <rect x="125" y="485" width="290" height="45" fill="#5C4022" opacity="0.55"/>
  <!-- Submersible Dewatering Pump Unit on Floor -->
  <rect x="215" y="432" width="68" height="88" rx="10" fill="#0B2545" stroke="#00A8E8" stroke-width="3"/>
  <rect x="230" y="416" width="38" height="18" rx="4" fill="#0D9488"/>
  <!-- Dewatering Discharge Hose Rising Out of Sump -->
  <path d="M249,416 C249,300 415,280 415,155 L415,95 L180,95" stroke="#0D9488" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Right Half of Sump: Sanitized, Jet-Cleaned & Disinfected Zone -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.45">
    <line x1="440" y1="215" x2="440" y2="530"/><line x1="530" y1="215" x2="530" y2="530"/>
    <line x1="620" y1="215" x2="620" y2="530"/><line x1="710" y1="215" x2="710" y2="530"/>
    <line x1="415" y1="295" x2="795" y2="295"/><line x1="415" y1="375" x2="795" y2="375"/>
    <line x1="415" y1="455" x2="795" y2="455"/>
  </g>

  <!-- Technician Inside Sump with PPE, Harness & Vacuum Sludge Wand -->
  <g>
    <!-- Safety Tripod & Harness Lifeline Above Manhole -->
    <line x1="365" y1="165" x2="460" y2="42" stroke="#94A3B8" stroke-width="6"/>
    <line x1="555" y1="165" x2="460" y2="42" stroke="#94A3B8" stroke-width="6"/>
    <circle cx="460" cy="42" r="12" fill="#00A8E8"/>
    <line x1="460" y1="54" x2="495" y2="355" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Technician Body -->
    <rect x="475" y="425" width="18" height="75" rx="6" fill="#0B2545"/>
    <rect x="502" y="425" width="18" height="75" rx="6" fill="#0B2545"/>
    <rect x="472" y="485" width="24" height="32" rx="5" fill="#0D9488"/>
    <rect x="500" y="485" width="24" height="32" rx="5" fill="#0D9488"/>
    <rect x="468" y="348" width="58" height="82" rx="14" fill="#133B6E" stroke="#00A8E8" stroke-width="2"/>
    <rect x="468" y="384" width="58" height="9" fill="#00A8E8"/>
    <circle cx="497" cy="322" r="20" fill="#FDBA74"/>
    <path d="M473,314 C473,294 521,294 521,314 Z" fill="#FFFFFF" stroke="#00A8E8" stroke-width="2.5"/>
    <!-- Vacuum Wand Extracting Remaining Floor Silt -->
    <line x1="472" y1="378" x2="365" y2="508" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
    <rect x="335" y="502" width="52" height="16" rx="6" fill="#00A8E8"/>
  </g>

  <!-- Process Telemetry Badges -->
  <g font-family="Manrope, Inter, sans-serif">
    <rect x="595" y="52" width="285" height="84" rx="14" fill="#0B2545" fill-opacity="0.94" stroke="#00A8E8" stroke-width="1.5"/>
    <text x="620" y="84" fill="#38BDF8" font-weight="700" font-size="12" letter-spacing="0.08em">SUMP &amp; OVERHEAD PROTOCOL</text>
    <text x="620" y="108" fill="#FFFFFF" font-weight="800" font-size="16">6-Step Verified Hygiene</text>
    <text x="620" y="125" fill="#94A3B8" font-weight="500" font-size="11.5">Dewatering • Vacuum • High-Pressure Jet</text>

    <rect x="560" y="245" width="215" height="68" rx="12" fill="#0B2545" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="586" cy="279" r="8" fill="#10B981"/>
    <text x="604" y="274" fill="#FFFFFF" font-weight="700" font-size="13">Sanitized Sump Walls</text>
    <text x="604" y="293" fill="#BAE6FD" font-weight="500" font-size="11.5">Biofilm &amp; Algae Removed</text>
  </g>
</svg>

