<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" fill="none">
  <defs>
    <!-- Spotless Sanitized Food-Grade Epoxy / Waterproofed Concrete Gradients -->
    <linearGradient id="leftWallAfter" x1="0" y1="0" x2="260" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8ECF8"/>
      <stop offset="55%" stop-color="#E6F4FC"/>
      <stop offset="100%" stop-color="#C5E4F7"/>
    </linearGradient>
    <linearGradient id="rightWallAfter" x1="960" y1="0" x2="700" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D2E8F6"/>
      <stop offset="55%" stop-color="#E2F2FB"/>
      <stop offset="100%" stop-color="#BFE0F5"/>
    </linearGradient>
    <linearGradient id="backWallAfter" x1="480" y1="105" x2="480" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="floorAfter" x1="480" y1="415" x2="480" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ceilingAfter" x1="480" y1="0" x2="480" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="cleanLightBeam" cx="50%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#E0F2FE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B2545" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <!-- 3D Perspective Chamber Geometry (Identical alignment to tank-before.svg) -->
  <!-- Ceiling -->
  <polygon points="0,0 960,0 700,105 260,105" fill="url(#ceilingAfter)"/>
  <!-- Left Wall -->
  <polygon points="0,0 260,105 260,415 0,600" fill="url(#leftWallAfter)"/>
  <!-- Right Wall -->
  <polygon points="960,0 700,105 700,415 960,600" fill="url(#rightWallAfter)"/>
  <!-- Back Wall -->
  <rect x="260" y="105" width="440" height="310" fill="url(#backWallAfter)"/>
  <!-- Sanitized Floor with Crystal Clear Fresh Water Fill -->
  <polygon points="260,415 700,415 960,600 0,600" fill="url(#floorAfter)"/>

  <!-- Clean Architectural Tile / Waterproof Coating Grid -->
  <g stroke="#93C5FD" stroke-width="1.2" opacity="0.55">
    <line x1="260" y1="105" x2="700" y2="105"/>
    <line x1="260" y1="210" x2="700" y2="210"/>
    <line x1="260" y1="315" x2="700" y2="315"/>
    <line x1="260" y1="415" x2="700" y2="415"/>
    <line x1="0" y1="190" x2="260" y2="210"/>
    <line x1="0" y1="390" x2="260" y2="315"/>
    <line x1="960" y1="190" x2="700" y2="210"/>
    <line x1="960" y1="390" x2="700" y2="315"/>
    <line x1="370" y1="105" x2="370" y2="415"/>
    <line x1="480" y1="105" x2="480" y2="415"/>
    <line x1="590" y1="105" x2="590" y2="415"/>
    <!-- Floor Perspective Grid Visible Through Crystal Clear Water -->
    <line x1="370" y1="415" x2="240" y2="600" stroke="#E0F2FE" stroke-opacity="0.55"/>
    <line x1="480" y1="415" x2="480" y2="600" stroke="#E0F2FE" stroke-opacity="0.55"/>
    <line x1="590" y1="415" x2="720" y2="600" stroke="#E0F2FE" stroke-opacity="0.55"/>
    <line x1="180" y1="472" x2="780" y2="472" stroke="#E0F2FE" stroke-opacity="0.55"/>
    <line x1="95" y1="532" x2="865" y2="532" stroke="#E0F2FE" stroke-opacity="0.55"/>
  </g>

  <!-- Crystal-Clear Water Surface Caustics & Light Shimmer on Floor -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.65" fill="none">
    <ellipse cx="480" cy="495" rx="220" ry="36"/>
    <ellipse cx="480" cy="495" rx="140" ry="20"/>
    <path d="M230,535 Q360,515 480,535 T730,535"/>
    <path d="M170,568 Q330,548 480,568 T790,568"/>
  </g>

  <!-- Clean Stainless Steel Access Ladder (Left Wall) -->
  <g>
    <line x1="145" y1="55" x2="115" y2="545" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    <line x1="205" y1="75" x2="182" y2="495" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    <line x1="141" y1="120" x2="201" y2="132" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="136" y1="195" x2="197" y2="204" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="131" y1="270" x2="193" y2="276" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="126" y1="345" x2="189" y2="348" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="121" y1="420" x2="185" y2="420" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Sanitized White uPVC Suction Pipe & Foot-Valve Strainer -->
  <rect x="555" y="105" width="22" height="275" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <rect x="546" y="368" width="40" height="32" rx="6" fill="#00A8E8" stroke="#0284C7" stroke-width="2"/>

  <!-- Ceiling Inspection Hatch & Bright Daylight Beam -->
  <ellipse cx="480" cy="48" rx="78" ry="22" fill="#E0F2FE" stroke="#64748B" stroke-width="4"/>
  <rect x="0" y="0" width="960" height="600" fill="url(#cleanLightBeam)"/>

  <!-- Clean Sparkle Accent Indicators -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M360,180 L364,192 L376,196 L364,200 L360,212 L356,200 L344,196 L356,192 Z"/>
    <path d="M635,245 L638,254 L647,257 L638,260 L635,269 L632,260 L623,257 L632,254 Z"/>
    <path d="M475,345 L478,354 L487,357 L478,360 L475,369 L472,360 L463,357 L472,354 Z"/>
  </g>

  <!-- Corner Perspective Framing Lines -->
  <line x1="0" y1="0" x2="260" y2="105" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="960" y1="0" x2="700" y2="105" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="260" y1="105" x2="260" y2="415" stroke="#94A3B8" stroke-width="2"/>
  <line x1="700" y1="105" x2="700" y2="415" stroke="#94A3B8" stroke-width="2"/>
  <line x1="0" y1="600" x2="260" y2="415" stroke="#0284C7" stroke-width="2.5"/>
  <line x1="960" y1="600" x2="700" y2="415" stroke="#0284C7" stroke-width="2.5"/>

  <!-- Callout Annotations Inside After Scene -->
  <g font-family="Inter, sans-serif" font-weight="600" font-size="13">
    <rect x="385" y="255" width="245" height="34" rx="17" fill="#0B2545" fill-opacity="0.88" stroke="#00A8E8" stroke-width="1.5"/>
    <circle cx="403" cy="272" r="5" fill="#10B981"/>
    <text x="417" y="277" fill="#FFFFFF">Jet-Scrubbed &amp; Disinfected Walls</text>

    <rect x="355" y="485" width="265" height="34" rx="17" fill="#0B2545" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="373" cy="502" r="5" fill="#10B981"/>
    <text x="387" y="507" fill="#FFFFFF">100% Sludge-Free Sanitized Base</text>
  </g>
</svg>

