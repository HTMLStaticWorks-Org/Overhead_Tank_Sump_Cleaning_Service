<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" fill="none">
  <defs>
    <radialGradient id="cylWallBefore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3F3222"/>
      <stop offset="45%" stop-color="#564733"/>
      <stop offset="80%" stop-color="#4A5240"/>
      <stop offset="100%" stop-color="#2E352B"/>
    </radialGradient>
    <radialGradient id="cylFloorBefore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B441B"/>
      <stop offset="65%" stop-color="#4B2F12"/>
      <stop offset="100%" stop-color="#311E0B"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="url(#cylWallBefore)"/>
  <!-- Cylindrical Ribbed Tank Corrugation Rings -->
  <ellipse cx="480" cy="320" rx="460" ry="270" stroke="#363D30" stroke-width="14" fill="none"/>
  <ellipse cx="480" cy="335" rx="390" ry="230" stroke="#3E4433" stroke-width="12" fill="none"/>
  <ellipse cx="480" cy="350" rx="320" ry="190" stroke="#474932" stroke-width="12" fill="none"/>
  <!-- Biofilm & Iron-Oxide Rust Stain Bands -->
  <ellipse cx="480" cy="355" rx="310" ry="182" fill="#3B4928" fill-opacity="0.65"/>
  <!-- Tank Bottom Base with Heavy Borehole Silt & Red-Brown Iron Sediment -->
  <ellipse cx="480" cy="380" rx="255" ry="148" fill="url(#cylFloorBefore)" stroke="#2A1B0A" stroke-width="8"/>
  <!-- Molded Ribbed Bottom Covered in Thick Sludge -->
  <line x1="265" y1="380" x2="695" y2="380" stroke="#3A240D" stroke-width="10"/>
  <line x1="480" y1="250" x2="480" y2="510" stroke="#3A240D" stroke-width="10"/>
  <ellipse cx="480" cy="380" rx="145" ry="82" fill="#593714" opacity="0.88"/>
  <ellipse cx="480" cy="385" rx="75" ry="42" fill="#7C4E1E" opacity="0.75"/>
  <!-- Brass Float Valve & Outlet Pipe with Calcified Scale -->
  <rect x="468" y="0" width="24" height="145" fill="#6D614E"/>
  <circle cx="480" cy="165" r="34" fill="#926A2D" stroke="#4D3715" stroke-width="4"/>
  <!-- Annotations -->
  <g font-family="Inter, sans-serif" font-weight="600" font-size="13">
    <rect x="175" y="195" width="235" height="34" rx="17" fill="#0F172A" fill-opacity="0.86" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="193" cy="212" r="5" fill="#F59E0B"/>
    <text x="207" y="217" fill="#F8FAFC">Slimy Rib-Ring Biofilm</text>
    <rect x="355" y="455" width="255" height="34" rx="17" fill="#0F172A" fill-opacity="0.88" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="373" cy="472" r="5" fill="#EF4444"/>
    <text x="387" y="477" fill="#F8FAFC">Borehole Iron &amp; Clay Silt</text>
  </g>
</svg>

