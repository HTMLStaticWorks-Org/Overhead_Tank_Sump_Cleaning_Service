<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="920" height="680" fill="none">
  <defs>
    <linearGradient id="skyHero1" x1="460" y1="0" x2="460" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="55%" stop-color="#133B6E"/>
      <stop offset="100%" stop-color="#1E5288"/>
    </linearGradient>
    <linearGradient id="tankShell1" x1="160" y1="120" x2="560" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="waterCutaway" x1="360" y1="210" x2="360" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#00A8E8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="jetSpray" x1="600" y1="285" x2="380" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Architectural Sky & Clean Terrace Backdrop -->
  <rect width="920" height="680" rx="24" fill="url(#skyHero1)"/>
  <!-- Subtle Technical Blueprint Grid Overlay -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="120" x2="920" y2="120"/><line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="360" x2="920" y2="360"/><line x1="0" y1="480" x2="920" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="680"/><line x1="360" y1="0" x2="360" y2="680"/>
    <line x1="540" y1="0" x2="540" y2="680"/><line x1="720" y1="0" x2="720" y2="680"/>
  </g>

  <!-- Rooftop Concrete Terrace Deck & Parapet Wall -->
  <rect x="0" y="510" width="920" height="170" fill="#1E293B"/>
  <rect x="0" y="492" width="920" height="22" fill="#334155"/>
  <line x1="0" y1="514" x2="920" y2="514" stroke="#00A8E8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Elevated RCC Pedestal Base Under Overhead Tank -->
  <rect x="135" y="472" width="420" height="42" rx="6" fill="#475569" stroke="#64748B" stroke-width="2"/>
  <rect x="165" y="445" width="45" height="30" fill="#334155"/>
  <rect x="480" y="445" width="45" height="30" fill="#334155"/>

  <!-- Main Overhead Water Storage Tank with Hygienic Interior Cutaway Window -->
  <rect x="155" y="135" width="380" height="315" rx="22" fill="url(#tankShell1)" stroke="#94A3B8" stroke-width="3"/>
  <!-- Structural Reinforcement Ribs on Tank Exterior -->
  <rect x="150" y="195" width="390" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="150" y="275" width="390" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="150" y="355" width="390" height="14" rx="7" fill="#CBD5E1"/>
  <!-- Top Inspection Manhole Cover & Vent Pipe -->
  <rect x="295" y="108" width="100" height="28" rx="8" fill="#00A8E8" stroke="#0284C7" stroke-width="2"/>
  <path d="M455,135 L455,88 Q455,72 472,72 L488,72 Q502,72 502,88 L502,96" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Cutaway Inspection View Showing Sanitized Interior & Pure Water -->
  <rect x="195" y="172" width="300" height="248" rx="16" fill="#0F172A" stroke="#00A8E8" stroke-width="3"/>
  <rect x="201" y="178" width="288" height="236" rx="12" fill="#E0F2FE"/>
  <!-- Clean Interior Tile Grid -->
  <g stroke="#BAE6FD" stroke-width="1">
    <line x1="201" y1="235" x2="489" y2="235"/><line x1="201" y1="295" x2="489" y2="295"/>
    <line x1="201" y1="355" x2="489" y2="355"/><line x1="275" y1="178" x2="275" y2="414"/>
    <line x1="345" y1="178" x2="345" y2="414"/><line x1="415" y1="178" x2="415" y2="414"/>
  </g>
  <!-- Fresh Sanitized Water Level Inside Cutaway -->
  <path d="M201,310 Q275,296 345,310 T489,310 L489,402 Q489,414 477,414 L213,414 Q201,414 201,402 Z" fill="url(#waterCutaway)"/>
  <path d="M201,310 Q275,296 345,310 T489,310" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.85"/>

  <!-- High-Pressure Rotary Jet Spray Cone Cleaning Tank Interior Wall -->
  <polygon points="590,286 355,192 355,305" fill="url(#jetSpray)"/>
  <!-- Sparkles on Sanitized Wall -->
  <circle cx="355" cy="235" r="6" fill="#FFFFFF"/>
  <circle cx="330" cy="265" r="4" fill="#FFFFFF"/>
  <circle cx="385" cy="250" r="5" fill="#7DD3FC"/>

  <!-- AQUAGUARD Technician in Full PPE Operating High-Pressure Jet Lance -->
  <g>
    <!-- Service Platform Ladder -->
    <line x1="635" y1="330" x2="615" y2="514" stroke="#64748B" stroke-width="7"/>
    <line x1="715" y1="330" x2="735" y2="514" stroke="#64748B" stroke-width="7"/>
    <rect x="615" y="330" width="115" height="12" rx="4" fill="#94A3B8"/>
    <line x1="628" y1="385" x2="722" y2="385" stroke="#94A3B8" stroke-width="5"/>
    <line x1="622" y1="445" x2="728" y2="445" stroke="#94A3B8" stroke-width="5"/>

    <!-- Technician Boots & Legs (Navy Overalls) -->
    <rect x="645" y="255" width="22" height="65" rx="8" fill="#0B2545"/>
    <rect x="678" y="255" width="22" height="65" rx="8" fill="#0B2545"/>
    <rect x="642" y="308" width="28" height="24" rx="6" fill="#0D9488"/>
    <rect x="676" y="308" width="28" height="24" rx="6" fill="#0D9488"/>
    <!-- Technician Torso (PPE Jumpsuit with High-Vis Aqua Stripes) -->
    <rect x="638" y="172" width="68" height="92" rx="16" fill="#133B6E" stroke="#00A8E8" stroke-width="2"/>
    <rect x="638" y="212" width="68" height="10" fill="#00A8E8"/>
    <rect x="652" y="172" width="10" height="50" fill="#00A8E8"/>
    <rect x="682" y="172" width="10" height="50" fill="#00A8E8"/>
    <!-- Head, Safety Goggles, Respirator Mask & White Safety Helmet -->
    <circle cx="672" cy="144" r="22" fill="#FDBA74"/>
    <rect x="653" y="136" width="32" height="12" rx="6" fill="#00A8E8" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M656,152 Q672,164 686,152" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <path d="M645,134 C645,112 699,112 699,134 Z" fill="#FFFFFF" stroke="#00A8E8" stroke-width="2.5"/>
    <rect x="640" y="131" width="64" height="6" rx="3" fill="#00A8E8"/>
    <!-- Technician Arms & Waterproof Gloves Holding Rotary Jet Lance -->
    <path d="M645,192 L598,275" stroke="#133B6E" stroke-width="18" stroke-linecap="round"/>
    <circle cx="595" cy="280" r="10" fill="#0D9488"/>
    <!-- High-Pressure Stainless Jet Lance -->
    <line x1="635" y1="292" x2="515" y2="262" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="515" cy="262" r="7" fill="#00A8E8"/>
  </g>

  <!-- Industrial High-Pressure Washer & Vacuum Sludge Extractor Unit on Terrace -->
  <rect x="755" y="418" width="120" height="82" rx="12" fill="#0F172A" stroke="#00A8E8" stroke-width="2.5"/>
  <rect x="770" y="432" width="90" height="28" rx="6" fill="#1E293B"/>
  <circle cx="792" cy="446" r="8" fill="#10B981"/>
  <circle cx="818" cy="446" r="8" fill="#00A8E8"/>
  <circle cx="775" cy="504" r="14" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="855" cy="504" r="14" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <!-- High-Pressure Hose Connecting Unit to Lance -->
  <path d="M755,465 C695,465 650,385 620,290" stroke="#00A8E8" stroke-width="5" fill="none" stroke-dasharray="10 4"/>

  <!-- Floating Status Cards Inside Illustration -->
  <g font-family="Manrope, Inter, sans-serif">
    <!-- Top Left Card -->
    <rect x="42" y="42" width="255" height="74" rx="14" fill="#0B2545" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="76" cy="79" r="18" fill="#00A8E8" fill-opacity="0.2"/>
    <path d="M69,79 L74,84 L84,74" stroke="#00A8E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="73" fill="#FFFFFF" font-weight="700" font-size="14">6-Stage Mechanised Care</text>
    <text x="104" y="94" fill="#94A3B8" font-weight="500" font-size="12">Dewatering • Sludge Vacuum • Jet</text>

    <!-- Bottom Left Card -->
    <rect x="42" y="555" width="285" height="78" rx="14" fill="#0B2545" fill-opacity="0.92" stroke="#0D9488" stroke-width="1.5"/>
    <circle cx="78" cy="594" r="20" fill="#0D9488" fill-opacity="0.25"/>
    <path d="M70,594 L76,600 L87,588" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="588" fill="#FFFFFF" font-weight="700" font-size="14">PPE-Equipped Technicians</text>
    <text x="108" y="609" fill="#94A3B8" font-weight="500" font-size="12">Hygienic Non-Entry &amp; Confined Protocols</text>

    <!-- Bottom Right Card -->
    <rect x="565" y="555" width="310" height="78" rx="14" fill="#0B2545" fill-opacity="0.92" stroke="#00A8E8" stroke-width="1.5"/>
    <circle cx="601" cy="594" r="20" fill="#00A8E8" fill-opacity="0.22"/>
    <path d="M593,594 L599,600 L610,588" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="632" y="588" fill="#FFFFFF" font-weight="700" font-size="14">Overhead Tanks &amp; Underground Sumps</text>
    <text x="632" y="609" fill="#94A3B8" font-weight="500" font-size="12">Homes • Apartments • Commercial Sites</text>
  </g>
</svg>

