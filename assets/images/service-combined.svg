<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none">
  <rect width="640" height="420" rx="16" fill="#0B2545"/>
  <!-- Building Dual-System Diagram: Sump Below + Rooftop Tank Above -->
  <!-- Left Card: Underground Sump -->
  <rect x="45" y="220" width="225" height="155" rx="12" fill="#1E293B" stroke="#0D9488" stroke-width="2.5"/>
  <rect x="65" y="242" width="185" height="112" rx="8" fill="#E0F2FE"/>
  <path d="M65,305 Q115,295 158,305 T250,305 L250,346 Q250,354 242,354 L73,354 Q65,354 65,346 Z" fill="#0D9488" fill-opacity="0.8"/>
  <text x="85" y="275" font-family="Manrope, sans-serif" font-weight="700" font-size="13" fill="#0B2545">1. Underground Sump</text>
  <!-- Right Card: Overhead Tank -->
  <rect x="370" y="65" width="225" height="165" rx="14" fill="#F1F5F9" stroke="#00A8E8" stroke-width="2.5"/>
  <rect x="392" y="90" width="181" height="118" rx="8" fill="#E0F2FE"/>
  <path d="M392,155 Q440,145 482,155 T573,155 L573,200 Q573,208 565,208 L400,208 Q392,208 392,200 Z" fill="#00A8E8" fill-opacity="0.85"/>
  <text x="414" y="125" font-family="Manrope, sans-serif" font-weight="700" font-size="13" fill="#0B2545">2. Overhead Tank</text>
  <!-- Synchronized Clean Water Riser Pipeline Connecting Sump to Overhead Tank -->
  <path d="M270,295 L320,295 L320,145 L370,145" stroke="#00A8E8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270,295 L320,295 L320,145 L370,145" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
  <circle cx="320" cy="220" r="24" fill="#0B2545" stroke="#10B981" stroke-width="3"/>
  <path d="M311,220 L318,227 L330,213" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Info Badge -->
  <rect x="345" y="285" width="250" height="88" rx="12" fill="#133B6E" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="368" y="316" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Synchronized Hygiene Loop</text>
  <text x="368" y="338" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#BAE6FD">Prevents uncleaned sump water</text>
  <text x="368" y="356" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#BAE6FD">from re-contaminating rooftop tanks</text>
</svg>

